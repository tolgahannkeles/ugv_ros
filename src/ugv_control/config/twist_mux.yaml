# Hız komutu önceliklendirici. Çıkış /cmd_vel (TwistStamped) -> diff_drive_controller.
# Girişler de TwistStamped olmalı (collision_guard use_stamped:=true ile yayınlar).
twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 100
      autonomous:
        topic: /cmd_vel_auto
        timeout: 0.5
        priority: 50
    locks:
      e_stop:
        topic: /e_stop
        timeout: 0.0
        priority: 255
