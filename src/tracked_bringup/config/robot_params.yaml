esp32_bridge:
  ros__parameters:
    # Port configuration for Pi 5 UART (GPIO 14/15)
    port: "/dev/ttyAMA0"

    # UART baudrate (11.5 KB/s bandwidth, sufficient for 50Hz IMU + 1Hz GPS)
    baudrate: 115200

    # Physical distance between track centerlines (meters)
    track_width: 0.22

    # Skid-steer scrub compensation factor (W_eff = 0.22 * 1.25 = 0.275m)
    slip_factor: 1.25

    # IMU TF frame id (REP-105 compliant)
    imu_frame_id: "imu_link"

    # GPS TF frame id (REP-105 compliant)
    gps_frame_id: "gps_link"